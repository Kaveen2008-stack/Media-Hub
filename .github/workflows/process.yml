name: process
run-name: ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job id"
        required: true
      mode:
        description: "edit"
        required: true
      payload:
        description: "JSON payload"
        required: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure ffmpeg + font
        run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          fc-list | grep -qi dejavu || (sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core)
      - run: pip install -r worker/requirements.txt
      - name: Run worker
        run: python worker/worker.py
        env:
          JOB_ID: ${{ inputs.job_id }}
          PAYLOAD: ${{ inputs.payload }}
          PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
